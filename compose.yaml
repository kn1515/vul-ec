services:
  web:
    build: .
    ports:
      - "127.0.0.1:${VULN_EC_PORT:-8080}:80"
    environment:
      APP_ENV: ctf
      DB_PATH: /var/www/data/shop.sqlite
    volumes:
      - shop-data:/var/www/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  shop-data:
